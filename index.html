    :root {
        /* twilight garden-party palette */
        --sky-top:     #1c1240;
        --sky-mid:     #6a3e93;
        --sky-glow:    #e96a8f;
        --sky-warm:    #ffcf86;
        --paper:       #fdf6ea;
        --paper-2:     #f6ead4;
        --ink:         #3c2b4a;
        --ink-soft:    #6a5677;
        --gold:        #e0a441;
        --berry:       #c94f6d;
        --sage:        #86a17c;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
    }

    body {
        font-family: 'Quicksand', sans-serif;
        background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-glow) 78%, var(--sky-warm) 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        position: relative;
    }

    /* ---------- ambient sky layer ---------- */
    .sky {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 1;
    }

        position: absolute;
        top: 6%;
        right: 10%;
        width: 70px;
        opacity: 0.9;
        filter: drop-shadow(0 0 18px rgba(255, 224, 178, 0.55));
    }
